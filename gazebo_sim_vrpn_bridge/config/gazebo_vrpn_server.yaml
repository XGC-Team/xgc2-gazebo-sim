# Gazebo-backed VRPN server defaults.

model_states_topic: /gazebo/model_states
port: 3883
publish_rate: 120.0
scan_interval: 2.0
stale_timeout: 1.0
velocity_filter_cutoff: 25.0
acceleration_filter_cutoff: 25.0
derivative_reset_timeout: 0.5
#
# Empty enabled_trackers means all recognized Gazebo robot models are exported.
# Set it to [ugv1, ugv2] to publish only those VRPN tracker names.
enabled_trackers: []

# Fixed transform from Gazebo model/body frame B to simulated mocap rigid-body
# frame M. The server publishes T_world_mocap = T_world_body * T_body_mocap.
# Use meters and radians.
default_body_to_tracker:
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

# Optional per-tracker overrides. The key is the VRPN rigid body name.
# gazebo_model_name is optional; if omitted, the server infers the tracker
# name from Gazebo model names such as ugv1, uav2, tello3, scoutugv1.
robots:
  ugv1:
    enabled: true
    # gazebo_model_name: ugv1
    body_to_tracker:
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
  # Example marker offset:
  # ugv2:
  #   enabled: true
  #   gazebo_model_name: ugv2
  #   body_to_tracker:
  #     xyz: [0.12, 0.0, 0.18]
  #     rpy: [0.0, 0.0, 0.0]
