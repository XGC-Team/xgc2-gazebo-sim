name: release-gazebo-sim-all

on:
  workflow_dispatch:
    inputs:
      meta_mode:
        description: "locked pins release-set versions; latest emits unpinned -all-latest"
        required: true
        default: locked
        type: choice
        options:
          - locked
          - latest
      trigger_children:
        description: "Trigger child product workflows before building the meta package"
        required: true
        default: true
        type: boolean
      publish:
        description: "Publish generated debs to the configured APT repository"
        required: true
        default: true
        type: boolean

jobs:
  dispatch-children:
    if: ${{ inputs.trigger_children }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gazebo-sim-tools
            repo: lxk36/xgc2-gazebo-sim-tools
            ref: noetic
            workflow: build-debs.yml
          - name: scout
            repo: lxk36/xgc2-agilex
            ref: xgc2-noetic
            workflow: build-debs.yml
          - name: px4-1-12
            repo: lxk36/xgc2-px4-sitl
            ref: v1.12-noetic
            workflow: build-debs.yml
          - name: px4-1-14
            repo: lxk36/xgc2-px4-sitl
            ref: v1.14-noetic
            workflow: build-debs.yml
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.XGC2_CI_PAT }}
    steps:
      - name: Validate orchestration token
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"

      - name: Dispatch and wait for ${{ matrix.name }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "${{ matrix.workflow }}" \
            --repo "${{ matrix.repo }}" \
            --ref "${{ matrix.ref }}"

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh run list \
                --repo "${{ matrix.repo }}" \
                --workflow "${{ matrix.workflow }}" \
                --branch "${{ matrix.ref }}" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "map(select(.createdAt >= \"${started_at}\")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty"
            )"
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 10
          done

          if [[ -z "${run_id}" ]]; then
            echo "failed to find dispatched run for ${{ matrix.repo }} ${{ matrix.ref }}" >&2
            exit 1
          fi

          gh run watch "${run_id}" --repo "${{ matrix.repo }}" --exit-status --interval 30

  verify-external-apt:
    needs:
      - dispatch-children
    if: ${{ always() && (!inputs.trigger_children || needs.dispatch-children.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait until child packages are visible in APT
        run: |
          .xgc2/scripts/check_apt_release_set.sh \
            --release-set .xgc2/release-set.yml \
            --external-only \
            --arch "${{ matrix.arch }}"

  build-and-publish-meta:
    needs:
      - verify-external-apt
    if: ${{ needs.verify-external-apt.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
      GAZEBO_SIM_META_MODE: ${{ inputs.meta_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check product version bump
        if: ${{ inputs.meta_mode == 'locked' }}
        run: .xgc2/scripts/check_version_bump.sh --ci

      - name: Build deb packages
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/gazebo-sim-meta-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-gazebo-sim-meta-debs-${{ inputs.meta_mode }}-${{ matrix.arch }}
          path: debs/*.deb

      - name: Publish to self-hosted APT repository
        if: ${{ inputs.publish && env.APT_REPO_HOST != '' && env.APT_REPO_PORT != '' && env.APT_REPO_SSH_KEY != '' && env.APT_REPO_KNOWN_HOSTS != '' }}
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir debs

  verify-final-apt:
    needs:
      - build-and-publish-meta
    if: ${{ inputs.publish && needs.build-and-publish-meta.result == 'success' && inputs.meta_mode == 'locked' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait until full locked release set is visible in APT
        run: |
          .xgc2/scripts/check_apt_release_set.sh \
            --release-set .xgc2/release-set.yml \
            --arch "${{ matrix.arch }}"
