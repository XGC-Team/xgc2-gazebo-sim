name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  compliance:
    runs-on: ubuntu-latest
    container: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run metadata checks
        run: |
          set -euo pipefail
          git diff --check HEAD
          bash -n .xgc2/scripts/*.sh
