name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    container: ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-dev:1.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run metadata checks
        run: |
          set -euo pipefail
          test -e "${GITHUB_WORKSPACE}/.git"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" diff --check HEAD
          bash -n "${GITHUB_WORKSPACE}"/.xgc2/scripts/*.sh
