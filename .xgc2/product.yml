schema: xgc2.product.v1
id: xgc2-gazebo-sim
name: XGC2 Gazebo Sim
version: 1.0.17-1
kind: ros1-apt
summary: Gazebo Classic simulation meta package for ROS Noetic.

ros:
  distro: noetic
  packages: []

apt:
  distribution: focal
  install:
    - ros-noetic-xgc2-gazebo-sim
  packages:
    - ros-noetic-xgc2-gazebo-sim
    - ros-noetic-xgc2-gazebo-sim-all
  depends:
    - ros-noetic-xgc2-gazebo-sim-manager
    - ros-noetic-xgc2-gazebo-sim-vrpn-bridge
    - ros-noetic-xgc2-gazebo-sim-scout
    - ros-noetic-xgc2-gazebo-sim-px4-1-12
    - ros-noetic-xgc2-gazebo-sim-px4-1-14
    - ros-noetic-xgc2-gazebo-sim-fs150-sitl
    - ros-noetic-vrpn-client-ros

usage:
  install: |
    sudo apt update
    sudo apt install ros-noetic-xgc2-gazebo-sim
  smoke_test: |
    dpkg -s ros-noetic-xgc2-gazebo-sim
    roslaunch --files gazebo_sim_scout simple.launch rviz:=false
    roslaunch --files gazebo_sim_px4_1_12 iris.launch gui:=false
    roslaunch --files gazebo_sim_px4_1_14 iris.launch gui:=false
    roslaunch --files gazebo_sim_fs150_sitl fs150.launch gui:=false
  notes: |
    This repository is the verified Gazebo simulation suite entrypoint. Source packages live in child product repositories.
    The aggregate package depends on child package names, but does not pin exact child versions.
    Child repositories may publish compatible packaging revisions independently; bump this product version only when the aggregate dependency set or compatibility contract changes.

ownership:
  paths:
    - fs150-sitl
